<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LinkVault - Quản lý Link Học Tập</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  
  :root {
    --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    --glass-bg: rgba(255, 255, 255, 0.12);
    --glass-border: rgba(255, 255, 255, 0.25);
    --text-primary: #ffffff;
    --text-secondary: rgba(255, 255, 255, 0.75);
    --card-bg: rgba(255, 255, 255, 0.15);
    --card-hover: rgba(255, 255, 255, 0.25);
    --accent: #ffd93d;
    --danger: #ff6b6b;
    --success: #51cf66;
  }
  
  body.light {
    --bg-gradient: linear-gradient(135deg, #a8edea 0%, #fed6e3 50%, #d299c2 100%);
    --glass-bg: rgba(255, 255, 255, 0.5);
    --glass-border: rgba(255, 255, 255, 0.7);
    --text-primary: #2d3748;
    --text-secondary: #4a5568;
    --card-bg: rgba(255, 255, 255, 0.7);
    --card-hover: rgba(255, 255, 255, 0.9);
  }
  
  body {
    background: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--text-primary);
    min-height: 100vh;
    overflow-x: hidden;
    transition: all 0.3s ease;
  }
  
  .app { display: flex; min-height: 100vh; }
  
  /* SIDEBAR */
  .sidebar {
    width: 280px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-right: 1px solid var(--glass-border);
    padding: 20px 0;
    overflow-y: auto;
    position: sticky;
    top: 0;
    height: 100vh;
  }
  
  .logo {
    padding: 0 20px 20px;
    border-bottom: 1px solid var(--glass-border);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-icon {
    width: 40px; height: 40px;
    background: linear-gradient(135deg, #ffd93d, #ff6b6b);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 15px rgba(255, 217, 61, 0.4);
  }
  .logo-text { font-size: 20px; font-weight: 700; }
  .logo-text span { color: var(--accent); }
  
  .sidebar-section { padding: 0 15px; margin-bottom: 20px; }
  .section-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--text-secondary);
    padding: 0 10px 10px;
    font-weight: 600;
    display: flex; justify-content: space-between; align-items: center;
  }
  .section-title button {
    background: transparent; border: none; color: var(--text-secondary);
    cursor: pointer; font-size: 16px; width: 22px; height: 22px;
    border-radius: 6px; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
  }
  .section-title button:hover { background: var(--glass-border); color: var(--text-primary); }
  
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 3px;
    color: var(--text-primary);
    font-size: 14px;
    position: relative;
  }
  .nav-item:hover { background: var(--glass-border); }
  .nav-item.active { background: var(--glass-border); font-weight: 600; }
  .nav-item .count {
    margin-left: auto;
    background: var(--glass-border);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
  }
  .nav-item .folder-color {
    width: 10px; height: 10px; border-radius: 50%;
  }
  .nav-item .actions {
    margin-left: auto; display: none; gap: 4px;
  }
  .nav-item:hover .actions { display: flex; }
  .nav-item:hover .count { display: none; }
  .nav-item .actions button {
    background: transparent; border: none; color: var(--text-secondary);
    cursor: pointer; width: 22px; height: 22px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px;
  }
  .nav-item .actions button:hover { background: var(--glass-bg); color: var(--text-primary); }
  
  /* MAIN */
  .main { flex: 1; padding: 25px 35px; overflow-y: auto; }
  
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 25px; gap: 15px; flex-wrap: wrap;
  }
  
  .search-box {
    flex: 1; min-width: 250px; max-width: 500px;
    position: relative;
  }
  .search-box input {
    width: 100%; padding: 12px 15px 12px 42px;
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    transition: all 0.2s;
  }
  .search-box input::placeholder { color: var(--text-secondary); }
  .search-box input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 217, 61, 0.2); }
  .search-box::before {
    content: "🔍"; position: absolute; left: 14px; top: 50%;
    transform: translateY(-50%); font-size: 16px;
  }
  
  .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  
  .btn {
    padding: 10px 18px;
    border: 1px solid var(--glass-border);
    background: var(--glass-bg);
    backdrop-filter: blur(10px);
    color: var(--text-primary);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
    transition: all 0.2s;
  }
  .btn:hover { background: var(--card-hover); transform: translateY(-1px); }
  .btn-primary {
    background: linear-gradient(135deg, #ffd93d, #ff9a3c);
    color: #2d3748; border: none;
    box-shadow: 0 4px 15px rgba(255, 154, 60, 0.4);
  }
  .btn-primary:hover { box-shadow: 0 6px 20px rgba(255, 154, 60, 0.6); }
  .btn-danger { background: var(--danger); color: white; border: none; }
  
  .current-view {
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .current-view h2 { font-size: 24px; font-weight: 700; }
  .current-view .view-count {
    background: var(--glass-bg);
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-secondary);
  }
  
  /* LINKS GRID */
  .links-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
  }
  
  .link-card {
    background: var(--card-bg);
    backdrop-filter: blur(15px);
    border: 1px solid var(--glass-border);
    border-radius: 16px;
    padding: 18px;
    transition: all 0.3s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .link-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #ffd93d, #ff6b6b, #764ba2);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .link-card:hover {
    background: var(--card-hover);
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  }
  .link-card:hover::before { opacity: 1; }
  
  .link-header {
    display: flex; align-items: flex-start; gap: 12px;
    margin-bottom: 10px;
  }
  .link-favicon {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .link-favicon img { width: 100%; height: 100%; object-fit: cover; }
  .link-title-wrap { flex: 1; min-width: 0; }
  .link-title {
    font-size: 15px; font-weight: 600;
    margin-bottom: 3px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .link-domain {
    font-size: 11px; color: var(--text-secondary);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .link-desc {
    font-size: 13px; color: var(--text-secondary);
    margin-bottom: 12px;
    overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    line-height: 1.4;
  }
  .link-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
  .tag-chip {
    background: var(--glass-border);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    color: var(--text-primary);
  }
  .link-footer {
    display: flex; justify-content: space-between; align-items: center;
    padding-top: 10px;
    border-top: 1px solid var(--glass-border);
  }
  .link-date { font-size: 11px; color: var(--text-secondary); }
  .link-actions { display: flex; gap: 5px; }
  .link-actions button {
    background: transparent; border: none;
    color: var(--text-secondary); cursor: pointer;
    width: 28px; height: 28px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .link-actions button:hover { background: var(--glass-border); color: var(--text-primary); }
  .link-actions button.del:hover { color: var(--danger); }
  
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: var(--text-secondary);
  }
  .empty-state .icon { font-size: 60px; margin-bottom: 15px; opacity: 0.5; }
  .empty-state h3 { margin-bottom: 8px; color: var(--text-primary); }
  
  /* MODAL */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center; justify-content: center;
    z-index: 100;
    padding: 20px;
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: linear-gradient(135deg, rgba(118, 75, 162, 0.95), rgba(102, 126, 234, 0.95));
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 25px;
    width: 100%; max-width: 550px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h3 { margin-bottom: 20px; font-size: 20px; }
  .form-group { margin-bottom: 15px; }
  .form-group label {
    display: block; margin-bottom: 6px;
    font-size: 13px; font-weight: 600;
    color: var(--text-secondary);
  }
  .form-group input, .form-group textarea, .form-group select {
    width: 100%;
    padding: 10px 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    color: var(--text-primary);
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
    border-color: var(--accent);
  }
  .form-group textarea { resize: vertical; min-height: 70px; }
  .form-group select option { background: #764ba2; color: white; }
  
  .color-picker {
    display: flex; gap: 8px; flex-wrap: wrap;
  }
  .color-option {
    width: 30px; height: 30px; border-radius: 50%;
    cursor: pointer; border: 3px solid transparent;
    transition: all 0.2s;
  }
  .color-option.selected { border-color: white; transform: scale(1.15); }
  
  .modal-actions {
    display: flex; justify-content: flex-end; gap: 10px;
    margin-top: 20px;
  }
  
  /* TOAST */
  .toast {
    position: fixed; bottom: 30px; right: 30px;
    background: var(--glass-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    padding: 14px 20px;
    border-radius: 12px;
    color: var(--text-primary);
    font-size: 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    transform: translateX(400px);
    transition: transform 0.3s;
    z-index: 200;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { transform: translateX(0); }
  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }
  
  /* RESPONSIVE */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; left: -280px; z-index: 50;
      transition: left 0.3s;
    }
    .sidebar.open { left: 0; }
    .main { padding: 15px; }
    .menu-toggle { display: flex !important; }
  }
  .menu-toggle {
    display: none;
    width: 40px; height: 40px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    align-items: center; justify-content: center;
    cursor: pointer; font-size: 20px;
  }
  
  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--glass-bg); }
</style>
</head>
<body>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <div class="logo-icon">📚</div>
      <div class="logo-text">Link<span>Vault</span></div>
    </div>
    
    <div class="sidebar-section">
      <div class="nav-item active" data-view="all" onclick="setView('all')">
        <span>🏠</span> <span>Tất cả</span>
        <span class="count" id="count-all">0</span>
      </div>
      <div class="nav-item" data-view="favorite" onclick="setView('favorite')">
        <span>⭐</span> <span>Yêu thích</span>
        <span class="count" id="count-fav">0</span>
      </div>
      <div class="nav-item" data-view="recent" onclick="setView('recent')">
        <span>🕐</span> <span>Gần đây</span>
        <span class="count" id="count-recent">0</span>
      </div>
    </div>
    
    <div class="sidebar-section">
      <div class="section-title">
        <span>📁 Thư mục</span>
        <button onclick="openFolderModal()" title="Thêm thư mục">+</button>
      </div>
      <div id="folder-list"></div>
    </div>
    
    <div class="sidebar-section">
      <div class="section-title">
        <span>🏷️ Thẻ tag</span>
        <button onclick="openTagModal()" title="Thêm tag">+</button>
      </div>
      <div id="tag-list"></div>
    </div>
  </aside>
  
  <!-- MAIN -->
  <main class="main">
    <div class="header">
      <div class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</div>
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Tìm kiếm theo tiêu đề, mô tả, URL..." oninput="renderLinks()">
      </div>
      <div class="header-actions">
        <button class="btn" onclick="toggleTheme()" title="Đổi theme">🌓</button>
        <button class="btn" onclick="exportData()" title="Xuất JSON">📤 Xuất</button>
        <button class="btn" onclick="document.getElementById('import-file').click()" title="Nhập JSON">📥 Nhập</button>
        <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
        <button class="btn btn-primary" onclick="openLinkModal()">+ Thêm Link</button>
      </div>
    </div>
    
    <div class="current-view">
      <h2 id="view-title">Tất cả Link</h2>
      <span class="view-count" id="view-count">0 mục</span>
    </div>
    
    <div id="links-container"></div>
  </main>
</div>

<!-- MODAL LINK -->
<div class="modal-overlay" id="link-modal">
  <div class="modal">
    <h3 id="link-modal-title">Thêm Link Mới</h3>
    <div class="form-group">
      <label>URL *</label>
      <input type="url" id="link-url" placeholder="https://example.com/bai-viet-hay">
    </div>
    <div class="form-group">
      <label>Tiêu đề / Ý nghĩa *</label>
      <input type="text" id="link-title" placeholder="VD: Hướng dẫn Fractal từ cơ bản đến nâng cao">
    </div>
    <div class="form-group">
      <label>Mô tả</label>
      <textarea id="link-desc" placeholder="Tóm tắt nội dung link..."></textarea>
    </div>
    <div class="form-group">
      <label>Thư mục</label>
      <select id="link-folder"><option value="">-- Không phân loại --</option></select>
    </div>
    <div class="form-group">
      <label>Tags (phân cách bằng dấu phẩy)</label>
      <input type="text" id="link-tags" placeholder="fractal, toán học, visual">
    </div>
    <div class="form-group">
      <label><input type="checkbox" id="link-fav"> Đánh dấu yêu thích</label>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('link-modal')">Hủy</button>
      <button class="btn btn-primary" onclick="saveLink()">💾 Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL FOLDER -->
<div class="modal-overlay" id="folder-modal">
  <div class="modal">
    <h3 id="folder-modal-title">Thêm Thư Mục</h3>
    <div class="form-group">
      <label>Tên thư mục *</label>
      <input type="text" id="folder-name" placeholder="VD: Fractal, AI, Bài báo khoa học...">
    </div>
    <div class="form-group">
      <label>Màu sắc</label>
      <div class="color-picker" id="folder-colors"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('folder-modal')">Hủy</button>
      <button class="btn btn-primary" onclick="saveFolder()">💾 Lưu</button>
    </div>
  </div>
</div>

<!-- MODAL TAG -->
<div class="modal-overlay" id="tag-modal">
  <div class="modal">
    <h3>Thêm Tag Mới</h3>
    <div class="form-group">
      <label>Tên tag *</label>
      <input type="text" id="tag-name" placeholder="VD: fractal, ai, deep-learning">
    </div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal('tag-modal')">Hủy</button>
      <button class="btn btn-primary" onclick="saveTag()">💾 Lưu</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
let state = {
  links: [],
  folders: [],
  tags: [],
  currentView: { type: 'all', id: null },
  editingLinkId: null,
  editingFolderId: null,
  selectedFolderColor: '#ffd93d'
};

const FOLDER_COLORS = ['#ffd93d','#ff6b6b','#51cf66','#339af0','#cc5de8','#ff922b','#20c997','#f06595','#868e96'];

// ============ STORAGE ============
function save() {
  localStorage.setItem('linkvault_data', JSON.stringify({
    links: state.links, folders: state.folders, tags: state.tags
  }));
}
function load() {
  const data = localStorage.getItem('linkvault_data');
  if (data) {
    const parsed = JSON.parse(data);
    state.links = parsed.links || [];
    state.folders = parsed.folders || [];
    state.tags = parsed.tags || [];
  }
  // Seed dữ liệu mẫu nếu trống
  if (state.links.length === 0 && state.folders.length === 0) {
    seedSampleData();
  }
}
function seedSampleData() {
  state.folders = [
    { id: 'f1', name: 'Fractal', color: '#cc5de8' },
    { id: 'f2', name: 'Học AI', color: '#339af0' },
    { id: 'f3', name: 'Bài báo khoa học', color: '#51cf66' },
    { id: 'f4', name: 'Giáo án', color: '#ff922b' }
  ];
  state.tags = [
    { id: 't1', name: 'toán học' },
    { id: 't2', name: 'machine-learning' },
    { id: 't3', name: 'deep-learning' },
    { id: 't4', name: 'research' },
    { id: 't5', name: 'visual' }
  ];
  state.links = [
    {
      id: 'l1', url: 'https://fractal.guide/',
      title: 'Hướng dẫn toàn diện về Fractal - Từ Mandelbrot đến Julia',
      description: 'Bộ tài liệu trực quan giải thích lý thuyết fractal, cách tạo và ứng dụng trong nghệ thuật số.',
      folderId: 'f1', tags: ['toán học','visual'], favorite: true, createdAt: Date.now() - 86400000
    },
    {
      id: 'l2', url: 'https://course.fast.ai/',
      title: 'Fast.ai - Khóa học Deep Learning thực chiến miễn phí',
      description: 'Phương pháp top-down học AI, đi từ ứng dụng thực tế đến lý thuyết nền tảng.',
      folderId: 'f2', tags: ['deep-learning','machine-learning'], favorite: true, createdAt: Date.now() - 172800000
    },
    {
      id: 'l3', url: 'https://arxiv.org/',
      title: 'arXiv - Kho preprint nghiên cứu khoa học hàng đầu',
      description: 'Truy cập hàng triệu bài báo khoa học trong lĩnh vực CS, AI, toán, vật lý...',
      folderId: 'f3', tags: ['research'], favorite: false, createdAt: Date.now() - 259200000
    },
    {
      id: 'l4', url: 'https://www.geogebra.org/',
      title: 'GeoGebra - Công cụ soạn giáo án toán học tương tác',
      description: 'Tạo hình học, đại số, giải tích trực quan phục vụ giảng dạy.',
      folderId: 'f4', tags: ['toán học'], favorite: false, createdAt: Date.now() - 345600000
    }
  ];
  save();
}

// ============ UTILS ============
function uid() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 5); }
function getDomain(url) {
  try { return new URL(url).hostname.replace('www.',''); } catch { return url; }
}
function getFavicon(url) {
  try {
    const domain = new URL(url).hostname;
    return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
  } catch { return ''; }
}
function formatDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('vi-VN', { day:'2-digit', month:'2-digit', year:'numeric' });
}
function toast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = (type==='success'?'✅ ':'⚠️ ') + msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ============ VIEWS ============
function setView(type, id=null) {
  state.currentView = { type, id };
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  if (type === 'all') document.querySelector('[data-view="all"]').classList.add('active');
  else if (type === 'favorite') document.querySelector('[data-view="favorite"]').classList.add('active');
  else if (type === 'recent') document.querySelector('[data-view="recent"]').classList.add('active');
  else if (type === 'folder') {
    const el = document.querySelector(`[data-folder-id="${id}"]`);
    if (el) el.classList.add('active');
  }
  else if (type === 'tag') {
    const el = document.querySelector(`[data-tag-id="${id}"]`);
    if (el) el.classList.add('active');
  }
  renderLinks();
  if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
}

function getFilteredLinks() {
  const q = document.getElementById('search-input').value.toLowerCase().trim();
  let list = [...state.links];
  
  if (state.currentView.type === 'favorite') list = list.filter(l => l.favorite);
  else if (state.currentView.type === 'recent') list = list.sort((a,b) => b.createdAt - a.createdAt).slice(0, 20);
  else if (state.currentView.type === 'folder') list = list.filter(l => l.folderId === state.currentView.id);
  else if (state.currentView.type === 'tag') list = list.filter(l => (l.tags||[]).includes(state.currentView.id));
  
  if (q) {
    list = list.filter(l =>
      (l.title||'').toLowerCase().includes(q) ||
      (l.description||'').toLowerCase().includes(q) ||
      (l.url||'').toLowerCase().includes(q) ||
      (l.tags||[]).some(t => t.toLowerCase().includes(q))
    );
  }
  return list.sort((a,b) => b.createdAt - a.createdAt);
}

function getViewTitle() {
  if (state.currentView.type === 'all') return 'Tất cả Link';
  if (state.currentView.type === 'favorite') return '⭐ Yêu thích';
  if (state.currentView.type === 'recent') return '🕐 Gần đây';
  if (state.currentView.type === 'folder') {
    const f = state.folders.find(x => x.id === state.currentView.id);
    return f ? `📁 ${f.name}` : 'Thư mục';
  }
  if (state.currentView.type === 'tag') return `🏷️ #${state.currentView.id}`;
  return '';
}

// ============ RENDER ============
function renderSidebar() {
  // Folders
  const fl = document.getElementById('folder-list');
  fl.innerHTML = state.folders.map(f => {
    const count = state.links.filter(l => l.folderId === f.id).length;
    return `
      <div class="nav-item ${state.currentView.type==='folder'&&state.currentView.id===f.id?'active':''}" 
           data-folder-id="${f.id}" onclick="setView('folder','${f.id}')">
        <span class="folder-color" style="background:${f.color}"></span>
        <span style="flex:1">${escapeHtml(f.name)}</span>
        <span class="count">${count}</span>
        <div class="actions">
          <button onclick="event.stopPropagation();editFolder('${f.id}')" title="Sửa">✏️</button>
          <button onclick="event.stopPropagation();deleteFolder('${f.id}')" title="Xóa">🗑️</button>
        </div>
      </div>`;
  }).join('') || '<div style="padding:10px;color:var(--text-secondary);font-size:12px">Chưa có thư mục</div>';
  
  // Tags
  const tl = document.getElementById('tag-list');
  const tagCounts = {};
  state.links.forEach(l => (l.tags||[]).forEach(t => tagCounts[t] = (tagCounts[t]||0)+1));
  tl.innerHTML = state.tags.map(t => {
    const count = tagCounts[t.name] || 0;
    return `
      <div class="nav-item ${state.currentView.type==='tag'&&state.currentView.id===t.name?'active':''}"
           data-tag-id="${t.name}" onclick="setView('tag','${t.name}')">
        <span>#</span>
        <span style="flex:1">${escapeHtml(t.name)}</span>
        <span class="count">${count}</span>
        <div class="actions">
          <button onclick="event.stopPropagation();deleteTag('${t.id}')" title="Xóa">🗑️</button>
        </div>
      </div>`;
  }).join('') || '<div style="padding:10px;color:var(--text-secondary);font-size:12px">Chưa có tag</div>';
  
  // Counts
  document.getElementById('count-all').textContent = state.links.length;
  document.getElementById('count-fav').textContent = state.links.filter(l=>l.favorite).length;
  document.getElementById('count-recent').textContent = Math.min(state.links.length, 20);
}

function renderLinks() {
  const list = getFilteredLinks();
  document.getElementById('view-title').textContent = getViewTitle();
  document.getElementById('view-count').textContent = `${list.length} mục`;
  
  const container = document.getElementById('links-container');
  if (list.length === 0) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="icon">📭</div>
        <h3>Chưa có link nào</h3>
        <p>Bấm "Thêm Link" để bắt đầu lưu trữ kiến thức của bạn!</p>
      </div>`;
    return;
  }
  
  container.innerHTML = `<div class="links-grid">${list.map(renderLinkCard).join('')}</div>`;
  renderSidebar();
}

function renderLinkCard(link) {
  const folder = state.folders.find(f => f.id === link.folderId);
  const favicon = getFavicon(link.url);
  const tagsHtml = (link.tags||[]).map(t => `<span class="tag-chip">#${escapeHtml(t)}</span>`).join('');
  const favIcon = link.favorite ? '⭐' : '☆';
  
  return `
    <div class="link-card" ondblclick="window.open('${escapeAttr(link.url)}','_blank')">
      <div class="link-header">
        <div class="link-favicon">
          ${favicon ? `<img src="${favicon}" onerror="this.parentElement.innerHTML='🔗'">` : '🔗'}
        </div>
        <div class="link-title-wrap">
          <div class="link-title">${escapeHtml(link.title || 'Không có tiêu đề')}</div>
          <div class="link-domain">${escapeHtml(getDomain(link.url))}${folder?` • <span style="color:${folder.color}">${escapeHtml(folder.name)}</span>`:''}</div>
        </div>
      </div>
      ${link.description ? `<div class="link-desc">${escapeHtml(link.description)}</div>` : ''}
      ${tagsHtml ? `<div class="link-tags">${tagsHtml}</div>` : ''}
      <div class="link-footer">
        <span class="link-date">${formatDate(link.createdAt)}</span>
        <div class="link-actions">
          <button onclick="toggleFavorite('${link.id}')" title="Yêu thích">${favIcon}</button>
          <button onclick="window.open('${escapeAttr(link.url)}','_blank')" title="Mở link">🔗</button>
          <button onclick="editLink('${link.id}')" title="Sửa">✏️</button>
          <button class="del" onclick="deleteLink('${link.id}')" title="Xóa">🗑️</button>
        </div>
      </div>
    </div>`;
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function escapeAttr(s) { return escapeHtml(s); }

// ============ LINK CRUD ============
function openLinkModal(id=null) {
  state.editingLinkId = id;
  const modal = document.getElementById('link-modal');
  const title = document.getElementById('link-modal-title');
  
  // Fill folder options
  const sel = document.getElementById('link-folder');
  sel.innerHTML = '<option value="">-- Không phân loại --</option>' +
    state.folders.map(f => `<option value="${f.id}">${escapeHtml(f.name)}</option>`).join('');
  
  if (id) {
    const l = state.links.find(x => x.id === id);
    if (!l) return;
    title.textContent = 'Sửa Link';
    document.getElementById('link-url').value = l.url;
    document.getElementById('link-title').value = l.title;
    document.getElementById('link-desc').value = l.description || '';
    document.getElementById('link-folder').value = l.folderId || '';
    document.getElementById('link-tags').value = (l.tags||[]).join(', ');
    document.getElementById('link-fav').checked = !!l.favorite;
  } else {
    title.textContent = 'Thêm Link Mới';
    document.getElementById('link-url').value = '';
    document.getElementById('link-title').value = '';
    document.getElementById('link-desc').value = '';
    document.getElementById('link-folder').value = '';
    document.getElementById('link-tags').value = '';
    document.getElementById('link-fav').checked = false;
  }
  modal.classList.add('active');
}

function saveLink() {
  const url = document.getElementById('link-url').value.trim();
  const title = document.getElementById('link-title').value.trim();
  if (!url || !title) { toast('Vui lòng nhập URL và tiêu đề!', 'error'); return; }
  
  const data = {
    url, title,
    description: document.getElementById('link-desc').value.trim(),
    folderId: document.getElementById('link-folder').value || null,
    tags: document.getElementById('link-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
    favorite: document.getElementById('link-fav').checked
  };
  
  // Auto-create tags mới
  data.tags.forEach(tagName => {
    if (!state.tags.find(t => t.name === tagName)) {
      state.tags.push({ id: uid(), name: tagName });
    }
  });
  
  if (state.editingLinkId) {
    const idx = state.links.findIndex(l => l.id === state.editingLinkId);
    state.links[idx] = { ...state.links[idx], ...data };
    toast('Đã cập nhật link!');
  } else {
    state.links.push({ id: uid(), ...data, createdAt: Date.now() });
    toast('Đã thêm link mới!');
  }
  save();
  closeModal('link-modal');
  renderLinks();
}

function editLink(id) { openLinkModal(id); }
function deleteLink(id) {
  if (!confirm('Xóa link này?')) return;
  state.links = state.links.filter(l => l.id !== id);
  save(); renderLinks();
  toast('Đã xóa!');
}
function toggleFavorite(id) {
  const l = state.links.find(x => x.id === id);
  l.favorite = !l.favorite;
  save(); renderLinks();
}

// ============ FOLDER CRUD ============
function openFolderModal(id=null) {
  state.editingFolderId = id;
  const title = document.getElementById('folder-modal-title');
  const colorPicker = document.getElementById('folder-colors');
  colorPicker.innerHTML = FOLDER_COLORS.map(c => 
    `<div class="color-option ${state.selectedFolderColor===c?'selected':''}" 
          style="background:${c}" onclick="selectFolderColor('${c}')"></div>`
  ).join('');
  
  if (id) {
    const f = state.folders.find(x => x.id === id);
    title.textContent = 'Sửa Thư Mục';
    document.getElementById('folder-name').value = f.name;
    state.selectedFolderColor = f.color;
    colorPicker.querySelectorAll('.color-option').forEach(el => {
      el.classList.toggle('selected', el.style.background === f.color || 
        rgbToHex(el.style.backgroundColor) === f.color);
    });
  } else {
    title.textContent = 'Thêm Thư Mục';
    document.getElementById('folder-name').value = '';
    state.selectedFolderColor = '#ffd93d';
  }
  document.getElementById('folder-modal').classList.add('active');
}
function rgbToHex(rgb) {
  if (rgb.startsWith('#')) return rgb;
  const m = rgb.match(/\d+/g);
  if (!m) return rgb;
  return '#' + m.slice(0,3).map(x => parseInt(x).toString(16).padStart(2,'0')).join('');
}
function selectFolderColor(c) {
  state.selectedFolderColor = c;
  document.querySelectorAll('#folder-colors .color-option').forEach(el => {
    el.classList.toggle('selected', rgbToHex(el.style.backgroundColor) === c);
  });
}
function saveFolder() {
  const name = document.getElementById('folder-name').value.trim();
  if (!name) { toast('Vui lòng nhập tên thư mục!', 'error'); return; }
  if (state.editingFolderId) {
    const f = state.folders.find(x => x.id === state.editingFolderId);
    f.name = name; f.color = state.selectedFolderColor;
    toast('Đã cập nhật thư mục!');
  } else {
    state.folders.push({ id: uid(), name, color: state.selectedFolderColor });
    toast('Đã thêm thư mục!');
  }
  save(); closeModal('folder-modal'); renderLinks();
}
function editFolder(id) { openFolderModal(id); }
function deleteFolder(id) {
  if (!confirm('Xóa thư mục này? (Các link trong thư mục sẽ không bị xóa)')) return;
  state.folders = state.folders.filter(f => f.id !== id);
  state.links.forEach(l => { if (l.folderId === id) l.folderId = null; });
  if (state.currentView.type === 'folder' && state.currentView.id === id) setView('all');
  save(); renderLinks();
  toast('Đã xóa thư mục!');
}

// ============ TAG CRUD ============
function openTagModal() {
  document.getElementById('tag-name').value = '';
  document.getElementById('tag-modal').classList.add('active');
}
function saveTag() {
  const name = document.getElementById('tag-name').value.trim().toLowerCase();
  if (!name) { toast('Vui lòng nhập tên tag!', 'error'); return; }
  if (state.tags.find(t => t.name === name)) { toast('Tag đã tồn tại!', 'error'); return; }
  state.tags.push({ id: uid(), name });
  save(); closeModal('tag-modal'); renderLinks();
  toast('Đã thêm tag!');
}
function deleteTag(id) {
  const tag = state.tags.find(t => t.id === id);
  if (!tag) return;
  if (!confirm(`Xóa tag "${tag.name}"?`)) return;
  state.tags = state.tags.filter(t => t.id !== id);
  state.links.forEach(l => { l.tags = (l.tags||[]).filter(t => t !== tag.name); });
  if (state.currentView.type === 'tag' && state.currentView.id === tag.name) setView('all');
  save(); renderLinks();
  toast('Đã xóa tag!');
}

// ============ IMPORT/EXPORT ============
function exportData() {
  const data = {
    version: '1.0',
    exportedAt: new Date().toISOString(),
    links: state.links,
    folders: state.folders,
    tags: state.tags
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `linkvault-backup-${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('Đã xuất file JSON!');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.links || !Array.isArray(data.links)) throw new Error('Format không hợp lệ');
      
      const choice = confirm(
        `Tìm thấy ${data.links.length} links, ${(data.folders||[]).length} thư mục, ${(data.tags||[]).length} tags.\n\n` +
        `OK = Gộp với dữ liệu hiện tại\nCancel = Xóa cũ và thay thế hoàn toàn`
      );
      
      if (choice) {
        // Merge
        const existingUrls = new Set(state.links.map(l => l.url));
        let added = 0;
        (data.links||[]).forEach(l => {
          if (!existingUrls.has(l.url)) {
            state.links.push({ ...l, id: l.id || uid() });
            added++;
          }
        });
        (data.folders||[]).forEach(f => {
          if (!state.folders.find(x => x.name === f.name)) {
            state.folders.push({ ...f, id: f.id || uid() });
          }
        });
        (data.tags||[]).forEach(t => {
          if (!state.tags.find(x => x.name === t.name)) {
            state.tags.push({ ...t, id: t.id || uid() });
          }
        });
        toast(`Đã gộp! Thêm ${added} links mới.`);
      } else {
        // Replace
        state.links = data.links || [];
        state.folders = data.folders || [];
        state.tags = data.tags || [];
        toast('Đã thay thế toàn bộ dữ liệu!');
      }
      save(); setView('all'); renderLinks();
    } catch (err) {
      toast('Lỗi đọc file: ' + err.message, 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

// ============ THEME ============
function toggleTheme() {
  document.body.classList.toggle('light');
  localStorage.setItem('linkvault_theme', document.body.classList.contains('light') ? 'light' : 'dark');
}
function loadTheme() {
  if (localStorage.getItem('linkvault_theme') === 'light') document.body.classList.add('light');
}

// ============ MODAL UTIL ============
function closeModal(id) { document.getElementById(id).classList.remove('active'); }
document.querySelectorAll('.modal-overlay').forEach(m => {
  m.addEventListener('click', e => { if (e.target === m) m.classList.remove('active'); });
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') document.querySelectorAll('.modal-overlay.active').forEach(m => m.classList.remove('active'));
});

// ============ INIT ============
loadTheme();
load();
renderLinks();
</script>
